<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的环保短语库</title>
    <style>
        :root { --primary-green: #2ecc71; --dark-green: #27ae60; --bg-color: #f0f7f4; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { max-width: 600px; width: 100%; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); text-align: center; }
        .card { border: 3px solid var(--primary-green); border-radius: 12px; padding: 20px; margin: 20px 0; }
        .visual-hint { font-size: 50px; }
        .chinese-hint { font-size: 1.2rem; font-weight: bold; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: 2px solid #eee; border-radius: 8px; cursor: pointer; background: white; }
        button.correct { background: var(--primary-green) !important; color: white; }
        button.wrong { background: #ff7675 !important; color: white; }
        .next-btn { margin-top: 15px; background: var(--dark-green); color: white; border: none; padding: 10px 25px; border-radius: 20px; display: none; cursor: pointer; }
        #admin-link { margin-top: 30px; font-size: 12px; color: #aaa; text-decoration: none; }
    </style>
</head>
<body>

<div class="container" id="game-ui">
    <h1 id="title">🌿 环保挑战</h1>
    <div id="progress">进度: 1 / 0</div>
    <div class="card">
        <div class="visual-hint" id="icon-hint">🌍</div>
        <div class="chinese-hint" id="text-hint">加载中...</div>
    </div>
    <div class="options-grid" id="options"></div>
    <div id="feedback" style="margin-top:10px; font-weight:bold;"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">下一题 →</button>
</div>

<script>
    // --- 以后你只需要修改这里的单词数据 ---
    // 格式：{ icon: "图标", zh: "中文", en: "英文" }
    const myVocabulary = [
        { icon: "🚮", zh: "把垃圾分类", en: "sort rubbish/litter" },
        { icon: "🧤", zh: "捡垃圾", en: "pick up litter/rubbish" },
        { icon: "🚱", zh: "关掉水龙头", en: "turn off the tap" },
        { icon: "🪥", zh: "刷牙", en: "brush your teeth" },
        { icon: "🍼", zh: "塑料瓶", en: "plastic bottles" },
        { icon: "🛍️", zh: "可重复使用的购物袋", en: "reusable shopping bags" },
        { icon: "🚌", zh: "公共交通", en: "public transportation" },
        { icon: "🌍", zh: "拯救这颗星球", en: "save the planet" },
        { icon: "💡", zh: "省电", en: "save electricity" },
        { icon: "🛠️", zh: "修理旧物件", en: "repair old items" }
        // 你可以继续在这里往下添加...
    ];

    let currentIdx = 0;
    let score = 0;
    let answered = false;
    let quizData = [];

    function init() {
        quizData = [...myVocabulary].sort(() => Math.random() - 0.5);
        document.getElementById('progress').innerText = `进度: 1 / ${quizData.length}`;
        showQuestion();
    }

    function showQuestion() {
        answered = false;
        let data = quizData[currentIdx];
        document.getElementById('icon-hint').innerText = data.icon;
        document.getElementById('text-hint').innerText = data.zh;
        document.getElementById('next-btn').style.display = "none";
        document.getElementById('feedback').innerText = "";

        // 生成干扰项
        let distractors = myVocabulary
            .filter(v => v.en !== data.en)
            .sort(() => Math.random() - 0.5)
            .slice(0, 3)
            .map(v => v.en);
        
        let options = [data.en, ...distractors].sort(() => Math.random() - 0.5);
        
        let html = "";
        options.forEach(opt => {
            html += `<button onclick="check('${opt}', this)">${opt}</button>`;
        });
        document.getElementById('options').innerHTML = html;
    }

    function check(selected, btn) {
        if(answered) return;
        answered = true;
        let correct = quizData[currentIdx].en;
        if(selected === correct) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
            // 高亮正确答案
            Array.from(document.getElementById('options').children).forEach(b => {
                if(b.innerText === correct) b.classList.add('correct');
            });
        }
        document.getElementById('next-btn').style.display = "inline-block";
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < quizData.length) {
            document.getElementById('progress').innerText = `进度: ${currentIdx + 1} / ${quizData.length}`;
            showQuestion();
        } else {
            document.getElementById('game-ui').innerHTML = `<h2>完成！得分: ${score}/${quizData.length}</h2><button onclick="location.reload()">重新开始</button>`;
        }
    }

    init();
</script>

<a id="admin-link" href="https://github.com/" target="_blank">管理后台 (GitHub)</a>

</body>
</html>
