<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语全能挑战中心</title>
    <style>
        :root { --primary-green: #2ecc71; --dark-green: #27ae60; --bg-color: #f0f7f4; --hint-gold: #f1c40f; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { max-width: 600px; width: 92%; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        
        #game-ui { display: none; }
        h1 { color: var(--dark-green); margin-bottom: 5px; font-size: 1.6rem; }
        .subtitle { color: #888; margin-bottom: 25px; font-size: 0.9rem; }

        /* 菜单样式 */
        .menu-grid { display: grid; gap: 15px; }
        .menu-btn { padding: 20px; border: 2px solid var(--primary-green); border-radius: 15px; background: white; cursor: pointer; font-size: 1.1rem; font-weight: bold; color: var(--dark-green); transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .menu-btn:hover { background: var(--primary-green); color: white; transform: translateY(-3px); }

        /* 卡片设计 */
        .card { 
            border: 3px dashed var(--primary-green); 
            border-radius: 20px; 
            padding: 30px 20px; 
            margin: 20px 0; 
            min-height: 220px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            position: relative; 
            cursor: pointer;
            background: #fff;
        }
        .step-indicator { position: absolute; top: 12px; right: 15px; font-size: 0.75rem; color: var(--hint-gold); font-weight: bold; }
        .visual-hint { font-size: 75px; margin-bottom: 10px; }
        .zh-layer { font-size: 1.4rem; font-weight: bold; color: var(--dark-green); margin: 10px 0; }
        .sentence-layer { font-size: 1.1rem; color: #444; background: #f9f9f9; padding: 15px; border-radius: 12px; margin-top: 10px; line-height: 1.4; }
        .sentence-layer u { color: var(--dark-green); font-weight: bold; text-underline-offset: 4px; }

        /* 选项与按钮 */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .option-btn { padding: 12px; border: 2px solid #eee; border-radius: 12px; background: white; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .option-btn:hover { border-color: var(--primary-green); background: #f0fff4; }
        .correct { background: var(--primary-green) !important; color: white; border-color: var(--dark-green); }
        .wrong { background: #ff7675 !important; color: white; border-color: #d63031; }
        
        .next-btn { margin-top: 25px; background: var(--dark-green); color: white; border: none; padding: 14px; border-radius: 30px; width: 100%; display: none; cursor: pointer; font-size: 1.1rem; font-weight: bold; }
        #feedback { margin-top: 15px; font-weight: bold; height: 24px; font-size: 1.1rem; }
    </style>
</head>
<body>

<!-- 主菜单 -->
<div class="container" id="menu-ui">
    <h1>🌿 英语全能挑战中心</h1>
    <p class="subtitle">Personal English Learning Hub</p>
    <div class="menu-grid">
        <button class="menu-btn" onclick="startGame('eco')">
            <span>♻️</span> 环境保护短语练习
        </button>
        <button class="menu-btn" onclick="startGame('trans')">
            <span>📝</span> 词性转换三阶挑战
        </button>
    </div>
</div>

<!-- 游戏界面 -->
<div class="container" id="game-ui">
    <div id="progress" style="font-size:0.85rem; color:#aaa; margin-bottom:5px;"></div>
    
    <div class="card" id="main-card" onclick="handleCardClick()">
        <div id="step-hint" class="step-indicator"></div>
        <span class="visual-hint" id="icon-hint"></span>
        <div class="zh-layer" id="zh-layer"></div>
        <div class="sentence-layer" id="sentence-layer"></div>
    </div>

    <div class="options-grid" id="options"></div>
    
    <div id="feedback"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">下一题 →</button>
</div>

<script>
    const libraries = {
        // 专题一：环境保护 (直接选择模式)
        eco: {
            mode: "direct",
            data: [
                {icon:"🚮", zh:"把垃圾分类", en:"sort rubbish/litter"},
                {icon:"🧤", zh:"捡垃圾", en:"pick up litter/rubbish"},
                {icon:"🚱", zh:"关掉水龙头", en:"turn off the tap"},
                {icon:"🪥", zh:"刷牙", en:"brush your teeth"},
                {icon:"🍼", zh:"塑料瓶", en:"plastic bottles"},
                {icon:"🛍️", zh:"可重复使用的购物袋", en:"reusable shopping bags"},
                {icon:"🚌", zh:"公共交通", en:"public transportation"},
                {icon:"🌍", zh:"拯救这颗星球", en:"save the planet"},
                {icon:"💡", zh:"省电", en:"save electricity"},
                {icon:"🛠️", zh:"修理旧物件", en:"repair old items"}
            ]
        },
        // 专题二：词性转换 (三阶段点击模式)
        trans: {
            mode: "step",
            data: [
                {icon:"🏘️", zh:"邻居(n.) / 社区(n.)", opts:["neighbour", "neighbourhood"], sent:"My _______ is very helpful, and there is a park in our _______.", ans:"neighbour"},
                {icon:"🏗️", zh:"建造(v.) / 建筑物(n.)", opts:["build", "building"], sent:"They plan to _______ a library. The _______ will be very tall.", ans:"build"},
                {icon:"♻️", zh:"使用(v.) / 可重复使用的(adj.)", opts:["use", "reusable"], sent:"We should _______ _______ bags instead of plastic ones.", ans:"use"},
                {icon:"💾", zh:"节省/拯救(v.) / 节省者(n.)", opts:["save", "saver"], sent:"Turn off the lights to _______ energy. Be an energy _______!", ans:"save"},
                {icon:"🛡️", zh:"安全(n.) / 安全的(adj.) / 安全地(adv.)", opts:["safety", "safe", "safely"], sent:"For your _______, please stay _______ and drive _______.", ans:"safety"},
                {icon:"👏", zh:"鼓励(v.) / 鼓励(n.)", opts:["encourage", "encouragement"], sent:"Our teachers _______ us. Their _______ is very important.", ans:"encourage"},
                {icon:"🌱", zh:"环境(n.) / 环境的(adj.)", opts:["environment", "environmental"], sent:"We must protect the _______. It is an _______ problem.", ans:"environment"},
                {icon:"📅", zh:"天(n.) / 每日的(adj.)", opts:["day", "daily"], sent:"Read English every _______. It is a good _______ habit.", ans:"day"},
                {icon:"🚌", zh:"运输(n.) / 交通工具(n.)", opts:["transport", "transportation"], sent:"The bus is a form of public _______. It helps _______ people.", ans:"transportation"},
                {icon:"📉", zh:"减少(v.) / 减少(n.)", opts:["reduce", "reduction"], sent:"We need to _______ waste. There is a _______ in plastic use.", ans:"reduce"},
                {icon:"🥣", zh:"混合(v.) / 混合物(n.)", opts:["mix", "mixture"], sent:"If you _______ blue and yellow, you get a green _______.", ans:"mix"},
                {icon:"⚡", zh:"电力(n.) / 电的(adj.)", opts:["electricity", "electric"], sent:"Don't waste _______. I want to buy an _______ car.", ans:"electricity"},
                {icon:"🚲", zh:"回收(v.) / 可回收的(adj.)", opts:["recycle", "recyclable"], sent:"Please _______ paper because it is _______.", ans:"recycle"},
                {icon:"🏛️", zh:"政府(n.) / 统治(v.)", opts:["government", "govern"], sent:"The _______ makes laws to _______ the country.", ans:"government"},
                {icon:"🔋", zh:"能量(n.) / 精力充沛的(adj.)", opts:["energy", "energetic"], sent:"Solar _______ is clean. These _______ kids never get tired.", ans:"energy"},
                {icon:"🦷", zh:"牙齿(单数) / 牙齿(复数)", opts:["tooth", "teeth"], sent:"I have a sore _______. I need to brush all my _______.", ans:"tooth"}
            ]
        }
    };

    let currentMode = "";
    let currentIdx = 0;
    let score = 0;
    let quizData = [];
    let currentStep = 1;
    let answered = false;

    function startGame(libKey) {
        const lib = libraries[libKey];
        currentMode = lib.mode;
        quizData = [...lib.data].sort(() => Math.random() - 0.5);
        currentIdx = 0;
        score = 0;
        document.getElementById('menu-ui').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        currentStep = 1;
        const data = quizData[currentIdx];
        
        document.getElementById('progress').innerText = `进度: ${currentIdx + 1} / ${quizData.length}`;
        document.getElementById('icon-hint').innerText = data.icon;
        document.getElementById('zh-layer').innerText = data.zh;
        document.getElementById('feedback').innerText = "";
        document.getElementById('next-btn').style.display = "none";
        document.getElementById('options').style.display = "none";
        document.getElementById('sentence-layer').style.display = "none";

        if (currentMode === "direct") {
            document.getElementById('zh-layer').style.display = "block";
            document.getElementById('options').style.display = "grid";
            document.getElementById('step-hint').innerText = "";
            generateDirectOptions(data);
        } else {
            document.getElementById('zh-layer').style.display = "none";
            document.getElementById('step-hint').innerText = "💡 点击卡片看中文";
        }
    }

    function handleCardClick() {
        if (currentMode !== "step" || answered) return;
        
        if (currentStep === 1) {
            document.getElementById('zh-layer').style.display = "block";
            document.getElementById('step-hint').innerText = "💡 再次点击看例句";
            currentStep = 2;
        } else if (currentStep === 2) {
            const data = quizData[currentIdx];
            document.getElementById('sentence-layer').innerHTML = data.sent.replace(/_______/g, "<u>_______</u>");
            document.getElementById('sentence-layer').style.display = "block";
            document.getElementById('options').style.display = "grid";
            document.getElementById('step-hint').innerText = "🎯 请选择正确形式";
            generateStepOptions(data);
            currentStep = 3;
        }
    }

    function generateDirectOptions(data) {
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";
        const allEco = libraries.eco.data;
        let distractors = allEco.filter(v => v.en !== data.en).sort(() => Math.random() - 0.5).slice(0, 3).map(v => v.en);
        let opts = [data.en, ...distractors].sort(() => Math.random() - 0.5);
        opts.forEach(o => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = o;
            btn.onclick = () => checkAnswer(o, btn, data.en);
            optionsDiv.appendChild(btn);
        });
    }

    function generateStepOptions(data) {
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";
        data.opts.forEach(o => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = o;
            btn.onclick = (e) => { e.stopPropagation(); checkAnswer(o, btn, data.ans); };
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selected, btn, correct) {
        if (answered || (currentMode === 'step' && currentStep < 3)) return;
        answered = true;
        if (selected === correct) {
            btn.classList.add('correct');
            document.getElementById('feedback').innerText = "Correct! ✨";
            document.getElementById('feedback').style.color = "var(--dark-green)";
            score++;
        } else {
            btn.classList.add('wrong');
            document.getElementById('feedback').innerText = "Answer: " + correct;
            document.getElementById('feedback').style.color = "#d63031";
            Array.from(document.getElementsByClassName('option-btn')).forEach(b => {
                if(b.innerText === correct) b.classList.add('correct');
            });
        }
        document.getElementById('next-btn').style.display = "block";
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) loadQuestion();
        else {
            document.getElementById('game-ui').innerHTML = `
                <div style="padding:40px 0;">
                    <h2 style="font-size:2rem;">🎉 CHALLENGE COMPLETE!</h2>
                    <p style="font-size:1.4rem; color:#444;">Score: <strong>${score}</strong> / ${quizData.length}</p>
                    <button class="menu-btn" style="width:100%; margin-top:20px; background:var(--primary-green); color:white; border:none;" onclick="location.reload()">Back to Menu</button>
                </div>`;
        }
    }
</script>
</body>
</html>
