<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语学习挑战中心</title>
    <style>
        :root { --primary-green: #2ecc71; --dark-green: #27ae60; --bg-color: #f0f7f4; --hint-gold: #f1c40f; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { max-width: 600px; width: 92%; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        
        #game-ui { display: none; }
        h1 { color: var(--dark-green); margin-bottom: 5px; }
        .subtitle { color: #888; margin-bottom: 25px; }

        /* 菜单样式 */
        .menu-grid { display: grid; gap: 15px; }
        .menu-btn { padding: 20px; border: 2px solid var(--primary-green); border-radius: 15px; background: white; cursor: pointer; font-size: 1.1rem; font-weight: bold; color: var(--dark-green); transition: 0.3s; }
        .menu-btn:hover { background: var(--primary-green); color: white; transform: translateY(-3px); }

        /* 卡片与游戏 */
        .card { border: 3px dashed var(--primary-green); border-radius: 20px; padding: 30px 20px; margin: 20px 0; min-height: 200px; display: flex; flex-direction: column; justify-content: center; position: relative; cursor: pointer; }
        .visual-hint { font-size: 70px; margin-bottom: 10px; }
        .zh-layer { font-size: 1.4rem; font-weight: bold; color: var(--dark-green); margin: 10px 0; }
        .sentence-layer { font-size: 1.1rem; color: #444; background: #f9f9f9; padding: 15px; border-radius: 10px; margin-top: 10px; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .option-btn { padding: 12px; border: 2px solid #eee; border-radius: 12px; background: white; cursor: pointer; transition: 0.2s; }
        .correct { background: var(--primary-green) !important; color: white; }
        .wrong { background: #ff7675 !important; color: white; }
        
        .next-btn { margin-top: 25px; background: var(--dark-green); color: white; border: none; padding: 12px; border-radius: 30px; width: 100%; display: none; cursor: pointer; }
    </style>
</head>
<body>

<!-- 主菜单 -->
<div class="container" id="menu-ui">
    <h1>🌿 英语全能挑战</h1>
    <p class="subtitle">选择一个专题开始练习</p>
    <div class="menu-grid">
        <button class="menu-btn" onclick="startGame('eco')">♻️ 环境保护短语 (直接选择)</button>
        <button class="menu-btn" onclick="startGame('trans')">📝 词性转换专题 (三阶挑战)</button>
    </div>
</div>

<!-- 游戏界面 -->
<div class="container" id="game-ui">
    <div id="progress" style="font-size:0.8rem; color:#aaa"></div>
    <div class="card" id="main-card" onclick="handleCardClick()">
        <div id="step-hint" style="position:absolute; top:10px; right:15px; font-size:0.7rem; color:var(--hint-gold)"></div>
        <span class="visual-hint" id="icon-hint"></span>
        <div class="zh-layer" id="zh-layer"></div>
        <div class="sentence-layer" id="sentence-layer"></div>
    </div>
    <div class="options-grid" id="options"></div>
    <div id="feedback" style="margin-top:15px; font-weight:bold; height:20px"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">下一题 →</button>
</div>

<script>
    const libraries = {
        // 旧专题：环境保护
        eco: {
            mode: "direct", // 直接选择模式
            data: [
                {icon:"🚮", zh:"把垃圾分类", en:"sort rubbish/litter"},
                {icon:"🧤", zh:"捡垃圾", en:"pick up litter/rubbish"},
                {icon:"🚱", zh:"关掉水龙头", en:"turn off the tap"}
                // ... 你可以把之前的52个都贴在这里
            ]
        },
        // 新专题：词性转换
       trans: {
    mode: "step", // 三阶段点击模式
    data: [
        {
            icon: "🏘️", 
            zh: "邻居 (n.) / 社区 (n.)", 
            opts: ["neighbour", "neighbourhood"], 
            sent: "My _______ is very helpful, and there is a park in our _______.", 
            ans: "neighbour"
        },
        {
            icon: "🏗️", 
            zh: "建造 (v.) / 建筑物 (n.)", 
            opts: ["build", "building"], 
            sent: "They plan to _______ a library. The _______ will be very tall.", 
            ans: "build"
        },
        {
            icon: "♻️", 
            zh: "使用 (v./n.) / 可重复使用的 (adj.)", 
            opts: ["use", "reusable"], 
            sent: "We should _______ _______ bags instead of plastic ones.", 
            ans: "use"
        },
        {
            icon: "💾", 
            zh: "节省/拯救 (v.) / 节省者 (n.)", 
            opts: ["save", "saver"], 
            sent: "Turn off the lights to _______ energy. Be an energy _______!", 
            ans: "save"
        },
        {
            icon: "🛡️", 
            zh: "安全 (n.) / 安全的 (adj.) / 安全地 (adv.)", 
            opts: ["safety", "safe", "safely"], 
            sent: "For your _______, please stay _______ and drive _______.", 
            ans: "safety"
        },
        {
            icon: "👏", 
            zh: "鼓励 (v.) / 鼓励 (n.) / 令人鼓舞的 (adj.)", 
            opts: ["encourage", "encouragement", "encouraging"], 
            sent: "Our teachers _______ us. Their _______ is very _______.", 
            ans: "encourage"
        },
        {
            icon: "🌱", 
            zh: "环境 (n.) / 环境的 (adj.)", 
            opts: ["environment", "environmental", "environmentally"], 
            sent: "We must protect the _______. It is an _______ problem.", 
            ans: "environment"
        },
        {
            icon: "📅", 
            zh: "天 (n.) / 每日的 (adj./adv.)", 
            opts: ["day", "daily"], 
            sent: "Read English every _______. It is a good _______ habit.", 
            ans: "day"
        },
        {
            icon: "🚌", 
            zh: "运输 (v./n.) / 交通工具 (n.)", 
            opts: ["transport", "transportation"], 
            sent: "The bus is a form of public _______. It helps _______ people.", 
            ans: "transportation"
        },
        {
            icon: "📉", 
            zh: "减少 (v.) / 减少 (n.)", 
            opts: ["reduce", "reduction"], 
            sent: "We need to _______ waste. There is a _______ in plastic use.", 
            ans: "reduce"
        },
        {
            icon: "🥣", 
            zh: "混合 (v.) / 混合物 (n.)", 
            opts: ["mix", "mixture"], 
            sent: "If you _______ blue and yellow, you get a green _______.", 
            ans: "mix"
        },
        {
            icon: "⚡", 
            zh: "电力 (n.) / 电工 (n.) / 电的 (adj.)", 
            opts: ["electricity", "electrician", "electric"], 
            sent: "Don't waste _______. The _______ is fixing the _______ fan.", 
            ans: "electricity"
        },
        {
            icon: "🚲", 
            zh: "回收 (v.) / 循环 (n.) / 可回收的 (adj.)", 
            opts: ["recycle", "cycle", "recyclable"], 
            sent: "We can _______ paper because it is _______.", 
            ans: "recycle"
        },
        {
            icon: "🏛️", 
            zh: "统治 (v.) / 政府 (n.) / 统治者 (n.)", 
            opts: ["govern", "government", "governor"], 
            sent: "The _______ makes laws to _______ the country.", 
            ans: "government"
        },
        {
            icon: "🔋", 
            zh: "能量 (n.) / 精力充沛的 (adj.)", 
            opts: ["energy", "energetic"], 
            sent: "Solar _______ is clean. These _______ kids never get tired.", 
            ans: "energy"
        },
        {
            icon: "🦷", 
            zh: "牙齿 (单数 n.) / 牙齿 (复数 n.)", 
            opts: ["tooth", "teeth"], 
            sent: "I have a sore _______. I need to brush all my _______.", 
            ans: "tooth"
        }
    ]
}

    let currentMode = "";
    let currentIdx = 0;
    let quizData = [];
    let currentStep = 1;
    let answered = false;

    function startGame(libKey) {
        const lib = libraries[libKey];
        currentMode = lib.mode;
        quizData = [...lib.data].sort(() => Math.random() - 0.5);
        currentIdx = 0;
        document.getElementById('menu-ui').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        currentStep = 1;
        const data = quizData[currentIdx];
        
        // 初始化显示
        document.getElementById('progress').innerText = `进度: ${currentIdx + 1} / ${quizData.length}`;
        document.getElementById('icon-hint').innerText = data.icon;
        document.getElementById('zh-layer').innerText = data.zh;
        document.getElementById('feedback').innerText = "";
        document.getElementById('next-btn').style.display = "none";
        document.getElementById('options').style.display = "none";
        document.getElementById('sentence-layer').style.display = "none";

        if (currentMode === "direct") {
            // 旧模式逻辑：直接显示中文，显示选项
            document.getElementById('zh-layer').style.display = "block";
            document.getElementById('options').style.display = "grid";
            document.getElementById('step-hint').innerText = "";
            generateDirectOptions(data);
        } else {
            // 新模式逻辑：初始隐藏中文和例句
            document.getElementById('zh-layer').style.display = "none";
            document.getElementById('step-hint').innerText = "点击提示中文";
        }
    }

    function handleCardClick() {
        if (currentMode !== "step" || answered) return;
        
        if (currentStep === 1) {
            document.getElementById('zh-layer').style.display = "block";
            document.getElementById('step-hint').innerText = "再次点击看例句";
            currentStep = 2;
        } else if (currentStep === 2) {
            const data = quizData[currentIdx];
            document.getElementById('sentence-layer').innerHTML = data.sent.replace(/_______/g, "<u>_______</u>");
            document.getElementById('sentence-layer').style.display = "block";
            document.getElementById('options').style.display = "grid";
            document.getElementById('step-hint').innerText = "选择正确形式";
            generateStepOptions(data);
            currentStep = 3;
        }
    }

    // 生成旧模式选项
    function generateDirectOptions(data) {
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";
        // 简单逻辑：随机抓2个别的凑数
        const allEn = libraries.eco.data.map(v => v.en);
        let opts = [data.en, ...allEn.filter(v => v !== data.en).sort(() => Math.random() - 0.5).slice(0, 3)];
        opts.sort(() => Math.random() - 0.5).forEach(o => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = o;
            btn.onclick = () => checkAnswer(o, btn, data.en);
            optionsDiv.appendChild(btn);
        });
    }

    // 生成新模式选项
    function generateStepOptions(data) {
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";
        data.opts.forEach(o => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = o;
            btn.onclick = (e) => { e.stopPropagation(); checkAnswer(o, btn, data.ans); };
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selected, btn, correct) {
        if (answered) return;
        answered = true;
        if (selected === correct) {
            btn.classList.add('correct');
            document.getElementById('feedback').innerText = "正确！✨";
        } else {
            btn.classList.add('wrong');
            document.getElementById('feedback').innerText = "错误，应选: " + correct;
            Array.from(document.getElementsByClassName('option-btn')).forEach(b => {
                if(b.innerText === correct) b.classList.add('correct');
            });
        }
        document.getElementById('next-btn').style.display = "block";
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) loadQuestion();
        else {
            document.getElementById('game-ui').innerHTML = `<h2>🎉 完成！</h2><button class="menu-btn" onclick="location.reload()">回到主菜单</button>`;
        }
    }
</script>
</body>
</html>
