<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环保短语挑战库</title>
    <style>
        :root { --primary-green: #2ecc71; --dark-green: #27ae60; --bg-color: #f0f7f4; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { max-width: 600px; width: 90%; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        
        /* 初始隐藏游戏界面 */
        #game-ui { display: none; }
        
        .menu-ui h1 { color: var(--dark-green); margin-bottom: 30px; }
        .start-btn { background: var(--primary-green); color: white; border: none; padding: 15px 40px; font-size: 1.2rem; border-radius: 30px; cursor: pointer; transition: transform 0.2s; shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .start-btn:hover { transform: scale(1.05); background: var(--dark-green); }

        .card { border: 3px solid var(--primary-green); border-radius: 15px; padding: 20px; margin: 20px 0; background: #fff; }
        .visual-hint { font-size: 60px; display: block; margin-bottom: 10px; }
        .chinese-hint { font-size: 1.4rem; font-weight: bold; color: #333; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .option-btn { padding: 12px; border: 2px solid #eee; border-radius: 10px; background: white; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .option-btn:hover { border-color: var(--primary-green); background: #f9fffb; }
        
        .correct { background: var(--primary-green) !important; color: white; border-color: var(--dark-green); }
        .wrong { background: #ff7675 !important; color: white; border-color: #d63031; }
        
        .next-btn { margin-top: 20px; background: var(--dark-green); color: white; border: none; padding: 12px 30px; border-radius: 25px; display: none; cursor: pointer; font-size: 1rem; }
        #progress { color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>

<!-- 菜单界面 -->
<div class="container menu-ui" id="menu-ui">
    <h1>🌿 个人环保挑战库</h1>
    <p style="color: #666; margin-bottom: 30px;">共收录 52 条环保相关短语</p>
    <button class="start-btn" onclick="startGame()">开始单词挑战</button>
</div>

<!-- 游戏界面 -->
<div class="container" id="game-ui">
    <div id="progress">进度: 1 / 52</div>
    <div class="card">
        <span class="visual-hint" id="icon-hint">🌍</span>
        <div class="chinese-hint" id="text-hint">准备好了吗？</div>
    </div>
    <div class="options-grid" id="options"></div>
    <div id="feedback" style="margin-top:15px; height: 20px; font-weight:bold;"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">下一题 →</button>
</div>

<script>
    // 完整 52 条数据预装
    const allData = [
        {icon:"🚮", zh:"把垃圾分类", en:"sort rubbish/litter"},
        {icon:"🧤", zh:"捡垃圾", en:"pick up litter/rubbish"},
        {icon:"🚱", zh:"关掉水龙头", en:"turn off the tap"},
        {icon:"🪥", zh:"刷牙", en:"brush your teeth"},
        {icon:"🍼", zh:"塑料瓶", en:"plastic bottles"},
        {icon:"🛍️", zh:"可重复使用的购物袋", en:"reusable shopping bags"},
        {icon:"🚌", zh:"公共交通", en:"public transportation"},
        {icon:"🚇", zh:"乘坐公共交通", en:"take public transport"},
        {icon:"🌍", zh:"拯救这颗星球", en:"save the planet"},
        {icon:"💣", zh:"战争或许会爆发", en:"the war might break out"},
        {icon:"🎓", zh:"成功的能力", en:"abilities to succeed in school"},
        {icon:"🔍", zh:"搜索有用的信息", en:"search for useful information"},
        {icon:"🚰", zh:"请关掉流水的水龙头", en:"turn off the running tap"},
        {icon:"🏘️", zh:"创建一个绿色环保小区", en:"build a green neighbourhood"},
        {icon:"🍾", zh:"收集瓶子", en:"collect bottles"},
        {icon:"🛠️", zh:"修理旧物件", en:"repair old items"},
        {icon:"♻️", zh:"垃圾分类", en:"sort rubbish"},
        {icon:"👜", zh:"做布包", en:"make cloth bags"},
        {icon:"🌿", zh:"捡起垃圾", en:"pick up litter"},
        {icon:"📖", zh:"写日记", en:"write a diary"},
        {icon:"🚫", zh:"减少使用塑料", en:"reduce plastic"},
        {icon:"✨", zh:"产生影响", en:"make a difference"},
        {icon:"⚡", zh:"浪费电", en:"waste electricity"},
        {icon:"🔵", zh:"一个垃圾回收桶", en:"a recycling bin"},
        {icon:"🍔", zh:"废弃的食物", en:"waste foods"},
        {icon:"🚿", zh:"关水龙头", en:"turn off the tap"},
        {icon:"🚗", zh:"电车", en:"electric cars"},
        {icon:"🏃", zh:"采取行动", en:"take action"},
        {icon:"🔄", zh:"轮流", en:"take turns"},
        {icon:"👨‍🏫", zh:"上环境课", en:"have environmental classes"},
        {icon:"🥣", zh:"混合在一起", en:"mix ... up with ..."},
        {icon:"🏢", zh:"低能耗的大楼", en:"low-energy buildings"},
        {icon:"💡", zh:"关灯", en:"turn off the light"},
        {icon:"🔌", zh:"省电", en:"save electricity"},
        {icon:"🇨🇳", zh:"谈论我的祖国", en:"talk about my home country"},
        {icon:"🎤", zh:"做演讲", en:"make a speech"},
        {icon:"🏙️", zh:"绿色花园城市", en:"become a green garden city"},
        {icon:"🌻", zh:"种向日葵", en:"plant sunflowers"},
        {icon:"🚶", zh:"步行去学校", en:"walk to school"},
        {icon:"📓", zh:"写绿色体验日记", en:"write a diary about green experiences"},
        {icon:"📚", zh:"学习环境保护", en:"learn more about environmental protection"},
        {icon:"🎲", zh:"轮流掷骰子", en:"take turns to roll the dice"},
        {icon:"🍀", zh:"变得绿色环保", en:"go green"},
        {icon:"🗓️", zh:"地球日活动", en:"Earth Day celebrations"},
        {icon:"🚫", zh:"错过一个回合", en:"miss a turn"},
        {icon:"🚮", zh:"垃圾分类", en:"sort the rubbish"},
        {icon:"♻️", zh:"重复使用布质购物袋", en:"reuse cloth bags"},
        {icon:"📉", zh:"减少使用塑料", en:"reduce the use of plastic"},
        {icon:"📦", zh:"回收废弃物", en:"recycle the waste"},
        {icon:"🌡️", zh:"正变得糟糕", en:"be getting worse"},
        {icon:"🙋", zh:"某人自己", en:"on one's own"},
        {icon:"🖼️", zh:"创作艺术作品", en:"make works of art"}
    ];

    let currentIdx = 0;
    let score = 0;
    let quizData = [];
    let answered = false;

    // 点击按钮执行的函数
    function startGame() {
        // 1. 隐藏菜单，显示游戏
        document.getElementById('menu-ui').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        
        // 2. 打乱数据并初始化
        quizData = [...allData].sort(() => Math.random() - 0.5);
        currentIdx = 0;
        score = 0;
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        const data = quizData[currentIdx];
        document.getElementById('progress').innerText = `进度: ${currentIdx + 1} / ${quizData.length}`;
        document.getElementById('icon-hint').innerText = data.icon;
        document.getElementById('text-hint').innerText = data.zh;
        document.getElementById('feedback').innerText = "";
        document.getElementById('next-btn').style.display = "none";

        // 生成干扰项
        let distractors = allData
            .filter(v => v.en !== data.en)
            .sort(() => Math.random() - 0.5)
            .slice(0, 3)
            .map(v => v.en);
        
        let options = [data.en, ...distractors].sort(() => Math.random() - 0.5);

        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, btn);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selected, btn) {
        if(answered) return;
        answered = true;
        const correct = quizData[currentIdx].en;
        
        if(selected === correct) {
            btn.classList.add('correct');
            document.getElementById('feedback').innerText = "正确！✨";
            score++;
        } else {
            btn.classList.add('wrong');
            document.getElementById('feedback').innerText = "选错了哦";
            // 高亮显示正确的那个按钮
            const btns = document.getElementsByClassName('option-btn');
            for(let b of btns) {
                if(b.innerText === correct) b.classList.add('correct');
            }
        }
        document.getElementById('next-btn').style.display = "inline-block";
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < quizData.length) {
            loadQuestion();
        } else {
            document.getElementById('game-ui').innerHTML = `
                <h2>🎉 全部完成！</h2>
                <p>你的得分: ${score} / ${quizData.length}</p>
                <button class="start-btn" onclick="location.reload()">重新开始</button>
            `;
        }
    }
</script>
</body>
</html>
